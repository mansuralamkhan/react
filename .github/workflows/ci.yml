name: CI Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  # --- JOB 1: Unit Tests (CRA expects tests in src/) ---
  unit-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci
      - name: Run unit tests
        run: CI=true npm test -- --coverage --watchAll=false
      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage/

  # --- JOB 2: Integration Tests (With PostgreSQL) ---
  integration-tests:
    runs-on: ubuntu-latest
    needs: unit-tests
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_PASSWORD: testpass
          POSTGRES_USER: testuser
          POSTGRES_DB: testdb
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U testuser"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci
      - name: Run integration tests
        run: CI=true npm test -- --testPathPattern="__integration__" --watchAll=false --passWithNoTests
        env:
          DATABASE_URL: postgresql://testuser:testpass@localhost:5432/testdb

  # --- JOB 3: E2E Tests (With Selenium) ---
  e2e-tests:
    runs-on: ubuntu-latest
    needs: integration-tests
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci
      - name: Build app
        run: npm run build
      - name: Serve app in background
        run: |
          npx serve -s build -l 3000 &
          sleep 5
      - name: Run E2E tests
        run: CI=true npm test -- --testPathPattern="__e2e__" --watchAll=false --passWithNoTests
        env:
          REACT_APP_API_URL: http://localhost:3000