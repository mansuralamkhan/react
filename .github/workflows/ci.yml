name: Ultimate Test Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  # --- JOB 1: UNIT TESTS (Fastest, no docker) ---
  unit-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5  # TOP 10%: Always set a timeout to kill hanging tests.
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci  # TOP 10%: Use 'ci' not 'install' for exact lockfile versions.
      - run: npm run test:unit -- --coverage
      - name: Upload Coverage (Optional but elite)
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage/

  # --- JOB 2: INTEGRATION TESTS (Requires DB) ---
  integration-tests:
    runs-on: ubuntu-latest
    needs: unit-tests  # TOP 10%: Do NOT run if unit tests fail.
    timeout-minutes: 10
    # TOP 10%: Use services instead of installing MySQL/Postgres natively.
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_PASSWORD: testpass
          POSTGRES_USER: testuser
          POSTGRES_DB: testdb
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U testuser"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci
      - name: Wait for DB & Run Migrations
        run: |
          npm run db:migrate
          npm run db:seed
        env:
          DATABASE_URL: postgresql://testuser:testpass@localhost:5432/testdb
      - run: npm run test:integration
        env:
          DATABASE_URL: postgresql://testuser:testpass@localhost:5432/testdb

  # --- JOB 3: E2E (Selenium) ---
  e2e-tests:
    runs-on: ubuntu-latest
    needs: integration-tests
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci
      
      # TOP 10%: Build the app FIRST in the background.
      - name: Build & Serve App
        run: |
          npm run build
          npm run start:test &
        env:
          PORT: 3000
          
      # TOP 10%: Use the official Selenium Docker image.
      - name: Run Selenium Tests
        run: npm run test:e2e
        env:
          SELENIUM_REMOTE_URL: http://localhost:4444/wd/hub
          APP_BASE_URL: http://localhost:3000
